name: test

on:
  push:
  pull_request:

jobs:
  studio:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: studio
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: studio/package-lock.json
      - run: npm ci
      - run: npm test
      - run: npm run build
      - run: npm audit --omit=dev

  beatsunlimited:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: beatsunlimited-app
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: beatsunlimited-app/package-lock.json
      - run: npm ci
      - run: npm run build
      - run: npm audit --omit=dev
