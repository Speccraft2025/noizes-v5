<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>ASCENT — Beyond the Ridge</title>
  <style>
    :root{--bg:#020403;--fg:#ece8d9;--muted:#9ca48f;--accent:#c9d66f}
    *{box-sizing:border-box}
    html,body{margin:0;background:var(--bg);color:var(--fg);font-family:Inter,Arial,sans-serif}
    body{height:790vh;overflow-x:hidden}
    #stage{position:fixed;inset:0;overflow:hidden;background:#010201}
    canvas{display:block;width:100%;height:100%}
    .grain{position:absolute;inset:0;pointer-events:none;opacity:.12;mix-blend-mode:soft-light;background-image:url("data:image/svg+xml,%3Csvg viewBox='0 0 140 140' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='.8' numOctaves='4' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)' opacity='.45'/%3E%3C/svg%3E")}
    .ui{position:absolute;inset:0;pointer-events:none}
    .brand{position:absolute;left:28px;top:22px;font-size:12px;letter-spacing:.35em;font-weight:700}
    .brand small{display:block;margin-top:8px;font-size:8px;letter-spacing:.28em;color:var(--muted);font-weight:500}
    .counter{position:absolute;right:28px;top:24px;font-size:10px;letter-spacing:.18em;color:var(--muted)}
    .chapter{position:absolute;left:6vw;bottom:12vh;max-width:min(650px,80vw);transition:opacity .45s ease,transform .45s ease;text-shadow:0 2px 30px rgba(0,0,0,.7)}
    .eyebrow{font-size:11px;letter-spacing:.28em;text-transform:uppercase;color:var(--accent)}
    .chapter h1{margin:.45rem 0 0;font-family:Georgia,'Times New Roman',serif;font-size:clamp(42px,7vw,110px);font-weight:400;line-height:.9;letter-spacing:-.035em}
    .chapter p{margin-top:16px;max-width:44ch;font-size:12px;line-height:1.6;color:#c9c8bb;letter-spacing:.06em}
    .scrollhint{position:absolute;left:50%;bottom:24px;transform:translateX(-50%);display:flex;gap:10px;align-items:center;font-size:9px;letter-spacing:.28em;color:var(--muted)}
    .scrollhint i{width:50px;height:1px;background:linear-gradient(90deg,transparent,var(--muted))}
    .progress{position:absolute;top:0;left:0;height:2px;background:var(--accent);width:0%}
    .vignette{position:absolute;inset:0;pointer-events:none;background:radial-gradient(circle at center,transparent 45%,rgba(0,0,0,.44) 100%)}
    .fade{position:absolute;inset:0;pointer-events:none;background:#000;opacity:1;transition:opacity 1.6s ease}
    .ready .fade{opacity:0}
    @media(max-width:700px){.brand{left:18px}.counter{right:18px}.chapter{left:22px;bottom:14vh}.chapter p{font-size:11px}}
  </style>
</head>
<body>
  <div id="stage">
    <div id="three"></div>
    <div class="grain"></div>
    <div class="vignette"></div>
    <div class="ui" style="display:none">
      <div class="progress" id="progress"></div>
      <div class="brand">ASCENT<small>BEYOND THE RIDGE</small></div>
      <div class="counter" id="counter">01 / 06</div>
      <div class="chapter" id="chapter">
        <div class="eyebrow">01 — THE APPROACH</div>
        <h1>Beyond<br/>the Ridge</h1>
        <p>Scroll slowly. The world is the interface.</p>
      </div>
      <div class="scrollhint"><i></i>SCROLL TO TRAVEL<i></i></div>
      <div class="fade"></div>
    </div>
  </div>

  <script type="module">
    import * as THREE from 'https://unpkg.com/three@0.165.0/build/three.module.js';

    const mount=document.getElementById('three');
    const renderer=new THREE.WebGLRenderer({antialias:true,powerPreference:'high-performance'});
    renderer.setPixelRatio(Math.min(devicePixelRatio,1.7));
    renderer.setSize(innerWidth,innerHeight);
    renderer.outputColorSpace=THREE.SRGBColorSpace;
    renderer.toneMapping=THREE.ACESFilmicToneMapping;
    renderer.toneMappingExposure=1.15;
    mount.appendChild(renderer.domElement);

    const scene=new THREE.Scene();
    scene.background=new THREE.Color('#07100b');
    scene.fog=new THREE.FogExp2('#0b160f',0.00085);
    const camera=new THREE.PerspectiveCamera(52,innerWidth/innerHeight,.1,5000);

    const fract=n=>n-Math.floor(n);
    function hash(x,z){return fract(Math.sin(x*127.1+z*311.7)*43758.5453123)}
    function noise(x,z){const xi=Math.floor(x),zi=Math.floor(z),xf=x-xi,zf=z-zi,u=xf*xf*(3-2*xf),v=zf*zf*(3-2*zf);const a=hash(xi,zi),b=hash(xi+1,zi),c=hash(xi,zi+1),d=hash(xi+1,zi+1);return THREE.MathUtils.lerp(THREE.MathUtils.lerp(a,b,u),THREE.MathUtils.lerp(c,d,u),v)}
    function fbm(x,z){let v=0,a=.5,f=1;for(let i=0;i<5;i++){v+=noise(x*f,z*f)*a;f*=2.03;a*=.5}return v}

    const W=1600,D=3000,SEG_X=300,SEG_Z=560;
    const geom=new THREE.PlaneGeometry(W,D,SEG_X,SEG_Z);geom.rotateX(-Math.PI/2);
    // APPROVED V2 AESTHETIC, EXPANDED TO A FULL WORLD
    // Multiple troughs / connected ranges, but same visual language.
    function troughA(z){
      return -250 + 72*Math.sin(z*.0024+.4) + 26*Math.sin(z*.007+.8);
    }
    function troughB(z){
      return  260 + 80*Math.sin(z*.0022+2.0) + 30*Math.sin(z*.0065+.2);
    }
    function troughC(z){
      return   15 + 120*Math.sin(z*.0017+3.1);
    }

    function troughWidthA(z){return 105 + 34*(.5+.5*Math.sin(z*.0042+.5));}
    function troughWidthB(z){return 118 + 40*(.5+.5*Math.sin(z*.0039+1.2));}
    function troughWidthC(z){return 145 + 45*(.5+.5*Math.sin(z*.0034+2.1));}

    function carve(x,c,w,depth){
      const q=(x-c)/w;
      return -depth*Math.exp(-q*q*.88);
    }

    function ridge(x,c,w,h){
      const q=(x-c)/w;
      return h*Math.exp(-q*q*.72);
    }

    function mountain(x,z,px,pz,amp,rx,rz){
      const dx=(x-px)/rx, dz=(z-pz)/rz;
      return amp*Math.exp(-(dx*dx+dz*dz)*.95);
    }

    function terrainHeight(x,z){
      const a=troughA(z),b=troughB(z),c=troughC(z);

      // Broad mountain country first.
      let h=82;
      h += 30*Math.sin(z*.0042);
      h += 24*Math.sin(x*.0045 + z*.0023);
      h += 15*Math.sin(x*.0030 - z*.0062);
      h += (fbm(x*.007,z*.007)-.48)*70;

      // Three distinct troughs.
      h += carve(x,a,troughWidthA(z),112);
      h += carve(x,b,troughWidthB(z),122);
      h += .65*carve(x,c,troughWidthC(z),82);

      // Connected mountain ranges.
      h += ridge(x,-600+75*Math.sin(z*.0018),190,128);
      h += ridge(x, 610+80*Math.sin(z*.0019+1.1),200,142);

      // Actual divider between A and B.
      const divider=(a+b)*.5 + 22*Math.sin(z*.0026+.3);
      h += ridge(x,divider,95,118);

      // Sparse memorable peaks, not a forest of spikes.
      const peaks=[
        [-610,-1100,170,180,240],[-400,-760,135,150,210],[520,-820,178,180,230],
        [-590,-420,195,195,245],[560,-280,168,170,220],[-480,100,150,155,220],
        [530,220,205,205,255],[-620,650,175,185,240],[570,820,190,195,250],
        [-420,1250,150,160,220],[610,1380,175,180,230]
      ];
      for(const [px,pz,amp,rx,rz] of peaks){
        h += mountain(x,z,px,pz,amp,rx,rz);
      }

      // Same v2-style meso texture / roughness.
      h += (fbm(x*.023,z*.023)-.47)*30;
      h += (fbm(x*.070,z*.070)-.5)*7;

      // Keep trough floors broad and traversable.
      const da=Math.abs(x-a)/troughWidthA(z);
      const db=Math.abs(x-b)/troughWidthB(z);
      const near=Math.min(da,db);
      const suppress=1-THREE.MathUtils.smoothstep(near,.45,1.2);
      h -= suppress*Math.max(0,(fbm(x*.04,z*.04)-.55))*20;
      h += suppress*(3.4*Math.sin(z*.014)+2.2*Math.sin(x*.022+z*.009));

      return h;
    }

    const pos=geom.attributes.position,colors=[];
    const cShadow=new THREE.Color('#07130d'),cDeep=new THREE.Color('#12331b'),cMid=new THREE.Color('#356629'),cMoss=new THREE.Color('#6f8735'),cGold=new THREE.Color('#c7a65a');
    for(let i=0;i<pos.count;i++){
      const x=pos.getX(i),z=pos.getZ(i),y=terrainHeight(x,z);pos.setY(i,y);
      const n=fbm(x*.015,z*.015),slopeTone=THREE.MathUtils.clamp((y+18)/245,0,1);
      let col=cShadow.clone().lerp(cDeep,THREE.MathUtils.clamp(slopeTone*1.4,0,1));
      col.lerp(cMid,THREE.MathUtils.clamp((slopeTone-.25)*1.4,0,1));
      if(n>.63)col.lerp(cMoss,(n-.63)*1.4);if(n>.83)col.lerp(cGold,(n-.83)*1.6);
      colors.push(col.r,col.g,col.b)
    }
    geom.setAttribute('color',new THREE.Float32BufferAttribute(colors,3));geom.computeVertexNormals();
    const terrainMat=new THREE.MeshStandardMaterial({vertexColors:true,roughness:.88,metalness:.03,flatShading:false});
    const terrain=new THREE.Mesh(geom,terrainMat);terrain.position.z=110;scene.add(terrain);

    // ============================================================
    // V18B AERIAL-ONLY TERRAIN EXTENSION
    // Original V17 terrain remains completely untouched.
    //
    // Original terrain world-Z bounds:
    //   local [-1500, +1500] + terrain.position.z(110)
    //   => approximately [-1390, +1610]
    //
    // This extension continues seamlessly behind it:
    //   world-Z approximately [-2990, -1390]
    // ============================================================
    const EXT_D=1600, EXT_SEG_Z=300;
    const extGeom=new THREE.PlaneGeometry(W,EXT_D,SEG_X,EXT_SEG_Z);
    extGeom.rotateX(-Math.PI/2);

    const extCenterZ=-2190; // back edge joins original at ~ -1390
    const extPos=extGeom.attributes.position;
    const extColors=[];

    for(let i=0;i<extPos.count;i++){
      const x=extPos.getX(i);
      const localZ=extPos.getZ(i);
      const worldZ=localZ+extCenterZ;

      // terrainHeight() expects the same local-Z domain used by V17:
      // worldZ = localZ_for_height + original terrain offset(110)
      const sampleZ=worldZ-110;
      const y=terrainHeight(x,sampleZ);
      extPos.setY(i,y);

      // EXACT V17 color language.
      const n=fbm(x*.015,sampleZ*.015);
      const slopeTone=THREE.MathUtils.clamp((y+18)/245,0,1);
      let col=cShadow.clone().lerp(cDeep,THREE.MathUtils.clamp(slopeTone*1.4,0,1));
      col.lerp(cMid,THREE.MathUtils.clamp((slopeTone-.25)*1.4,0,1));
      if(n>.63)col.lerp(cMoss,(n-.63)*1.4);
      if(n>.83)col.lerp(cGold,(n-.83)*1.6);
      extColors.push(col.r,col.g,col.b);
    }

    extGeom.setAttribute('color',new THREE.Float32BufferAttribute(extColors,3));
    extGeom.computeVertexNormals();

    // Same material object = same approved aesthetic.
    const extTerrain=new THREE.Mesh(extGeom,terrainMat);
    extTerrain.position.z=extCenterZ;
    scene.add(extTerrain);


    scene.add(new THREE.HemisphereLight('#57725a','#030504',.75));
    const sun=new THREE.DirectionalLight('#ffd58a',5.2);sun.position.set(-420,520,-780);scene.add(sun);
    const warm=new THREE.PointLight('#d8aa54',1600,700,2);warm.position.set(20,70,-240);scene.add(warm);

    const pCount=2200,pGeo=new THREE.BufferGeometry(),pPos=new Float32Array(pCount*3);
    for(let i=0;i<pCount;i++){pPos[i*3]=(Math.random()-.5)*1600;pPos[i*3+1]=30+Math.random()*320;pPos[i*3+2]=(Math.random()-.5)*3000}
    pGeo.setAttribute('position',new THREE.BufferAttribute(pPos,3));
    const particles=new THREE.Points(pGeo,new THREE.PointsMaterial({color:'#c7d19a',size:.45,transparent:true,opacity:.18,depthWrite:false}));scene.add(particles);

    const pathPts=[
      // AERIAL — wide survey of many peaks / troughs.
      new THREE.Vector3(   0, 760,-1450),
      new THREE.Vector3(-120, 720,-1320),
      new THREE.Vector3(-220, 660,-1180),

      // PEAK TRAVERSAL — still high, moving above connected ranges.
      new THREE.Vector3(-280, 570,-1000),
      new THREE.Vector3(-300, 470, -820),

      // DESCENT into Trough A.
      new THREE.Vector3(-285, 350, -650),
      new THREE.Vector3(-270, 245, -480),
      new THREE.Vector3(-255, 170, -320),

      // APPROVED TROUGHLANGUAGE — low, smooth, atmospheric.
      new THREE.Vector3(-250, 118, -160),
      new THREE.Vector3(-245, 105,   10),
      new THREE.Vector3(-235, 108,  190),
      new THREE.Vector3(-220, 115,  365),

      // CLIMB connected divider / peak.
      new THREE.Vector3(-170, 160,  530),
      new THREE.Vector3( -90, 245,  680),
      new THREE.Vector3(  10, 350,  805),

      // CREST — reveal neighboring trough.
      new THREE.Vector3(  80, 465,  900),
      new THREE.Vector3( 120, 500,  950),

      // DESCEND into Trough B.
      new THREE.Vector3( 210, 410, 1060),
      new THREE.Vector3( 270, 300, 1190),
      new THREE.Vector3( 295, 205, 1330),
      new THREE.Vector3( 285, 140, 1480),

      // Continue in Trough B.
      new THREE.Vector3( 275, 118, 1640),
      new THREE.Vector3( 285, 120, 1810)
    ];
    const curve=new THREE.CatmullRomCurve3(pathPts,false,'centripetal',.5);
    // Camera aim is calculated independently from the camera path.
    // Important: do NOT aim at a fraction of camera altitude — that pitches into the floor.
    // Instead, look ahead along the route and aim at a point above the local terrain/horizon.
    function cameraLookTarget(progress,cameraPos){
      // All targets move gradually and stay farther ahead than before.
      // This prevents abrupt yaw/pitch changes between phases.

      if(progress < .30){
        const t=THREE.MathUtils.smoothstep(progress,0,.30);
        return new THREE.Vector3(
          THREE.MathUtils.lerp(-20,-245,t),
          THREE.MathUtils.lerp(220,180,t),
          THREE.MathUtils.lerp(-420,-610,t)
        );
      }

      if(progress < .54){
        const t=THREE.MathUtils.smoothstep(progress,.30,.54);
        return new THREE.Vector3(
          THREE.MathUtils.lerp(-245,-225,t),
          THREE.MathUtils.lerp(180,125,t),
          THREE.MathUtils.lerp(-610,360,t)
        );
      }

      if(progress < .74){
        const t=THREE.MathUtils.smoothstep(progress,.54,.74);
        return new THREE.Vector3(
          THREE.MathUtils.lerp(-225,85,t),
          THREE.MathUtils.lerp(125,305,t),
          THREE.MathUtils.lerp(360,940,t)
        );
      }

      if(progress < .84){
        const t=THREE.MathUtils.smoothstep(progress,.74,.84);
        return new THREE.Vector3(
          THREE.MathUtils.lerp(85,285,t),
          THREE.MathUtils.lerp(305,165,t),
          THREE.MathUtils.lerp(940,1480,t)
        );
      }

      const t=THREE.MathUtils.smoothstep(progress,.84,1);
      return new THREE.Vector3(
        THREE.MathUtils.lerp(285,300,t),
        THREE.MathUtils.lerp(165,135,t),
        THREE.MathUtils.lerp(1480,1900,t)
      );
    }

    // ============================================================
    // TRUE AERIAL PROLOGUE
    //
    // Visual grammar:
    // high over terrain → landscape fills viewport →
    // glide forward + lose altitude → individual peaks grow →
    // one valley becomes legible → exact V17 handoff.
    // ============================================================

    // Compute the EXACT V17 runtime entry position after its own safety logic.
    const v17Entry=pathPts[0].clone();
    {
      const floorY=terrainHeight(v17Entry.x,v17Entry.z-110);
      const phaseClearance=180; // V17 p=0 branch
      v17Entry.y=Math.max(v17Entry.y,floorY+phaseClearance);

      let sideThreat=0;
      for(const dx of [-85,-60,60,85]){
        const h=terrainHeight(v17Entry.x+dx,v17Entry.z-110+40);
        sideThreat=Math.max(sideThreat,h-(v17Entry.y-55));
      }
      if(sideThreat>0)v17Entry.y+=Math.min(70,sideThreat*.45);
    }

    // The camera begins ABOVE the terrain extension — not outside the world.
    // z advances forward toward V17; y drops progressively.
    const aerialPts=[
      new THREE.Vector3(   40,1120,-2480),
      new THREE.Vector3(  -10,1080,-2320),
      new THREE.Vector3(  -55,1000,-2140),
      new THREE.Vector3( -100, 900,-1960),
      new THREE.Vector3( -135, 790,-1800),
      new THREE.Vector3( -120, 690,-1660),
      new THREE.Vector3(  -65, 610,-1540),
      v17Entry.clone()
    ];
    const aerialCurve=new THREE.CatmullRomCurve3(aerialPts,false,'centripetal',.5);

    function aerialLookTarget(ap){
      // Start with a true downward-oblique survey into the world.
      // Pitch progressively levels toward V17's existing forward gaze.
      const survey=new THREE.Vector3(
        THREE.MathUtils.lerp(-20,-70,ap),
        THREE.MathUtils.lerp(120,185,ap),
        THREE.MathUtils.lerp(-1480,-1180,ap)
      );

      // Exact V17 look target at its start.
      const v17Look=cameraLookTarget(0,v17Entry);

      // Hold map-like aerial orientation through most of the prologue,
      // then smoothly transition to V17's gaze.
      const handoff=THREE.MathUtils.smoothstep(ap,.68,1);
      return survey.lerp(v17Look,handoff);
    }

    function aerialFov(ap){
      // Reference-like wide overview, gradually returning to V17's opening lens.
      return THREE.MathUtils.lerp(
        61,
        52,
        THREE.MathUtils.smoothstep(ap,.58,1)
      );
    }

    // 140vh aerial prologue + original V17 550vh exactly.
    let prologuePx=innerHeight*1.4;
    let v17ScrollPx=innerHeight*5.5;

    let inAerial=true;
    let targetAerial=0;
    let smoothAerial=0;
    let v17HandoffDone=false;

    // Initialize the page at the true aerial frame.
    camera.position.copy(aerialPts[0]);
    lookTarget.copy(aerialLookTarget(0));
    camera.lookAt(lookTarget);
    camera.fov=aerialFov(0);
    camera.updateProjectionMatrix();


    let targetProgress=0,smoothProgress=0,currentChapter=-1;
    const chapterEl=document.getElementById('chapter'),counterEl=document.getElementById('counter'),progressEl=document.getElementById('progress');
    const chapters=[
      {p:0,eyebrow:'01 — AERIAL',title:'The<br/>Landscape',body:'Peaks and troughs extend beyond the frame.'},
      {p:.18,eyebrow:'02 — PEAKS',title:'Above<br/>the Ranges',body:'Travel high enough to understand the geography.'},
      {p:.34,eyebrow:'03 — DESCENT',title:'Into<br/>the Trough',body:'The world closes around the camera.'},
      {p:.50,eyebrow:'04 — TROUGH A',title:'Between<br/>Giants',body:'The approved visual language: green, gold, atmospheric, smooth.'},
      {p:.66,eyebrow:'05 — ASCENT',title:'Climb<br/>the Divider',body:'Follow the terrain upward.'},
      {p:.75,eyebrow:'06 — CREST',title:'The Next<br/>Valley',body:'Cross the summit and reveal the adjacent trough.'},
      {p:.84,eyebrow:'07 — TROUGH B',title:'Beyond<br/>the Ridge',body:'Dive into the second trough and continue.'}
    ];
    function updateChapter(p){let idx=0;for(let i=0;i<chapters.length;i++)if(p>=chapters[i].p)idx=i;if(idx===currentChapter)return;currentChapter=idx;chapterEl.style.opacity='0';chapterEl.style.transform='translateY(12px)';setTimeout(()=>{const c=chapters[idx];chapterEl.innerHTML=`<div class="eyebrow">${c.eyebrow}</div><h1>${c.title}</h1><p>${c.body}</p>`;chapterEl.style.opacity='1';chapterEl.style.transform='translateY(0)';counterEl.textContent=String(idx+1).padStart(2,'0')+' / '+String(chapters.length).padStart(2,'0')},180)}
    function updateScroll(){
      prologuePx=innerHeight*1.4;
      v17ScrollPx=innerHeight*5.5;

      if(scrollY<prologuePx){
        inAerial=true;
        targetAerial=THREE.MathUtils.clamp(scrollY/prologuePx,0,1);
        targetProgress=0;
      }else{
        inAerial=false;
        targetAerial=1;
        // Preserve V17's original exact 550vh scroll-to-progress mapping.
        targetProgress=THREE.MathUtils.clamp((scrollY-prologuePx)/v17ScrollPx,0,1);
      }
    }
    addEventListener('scroll',updateScroll,{passive:true});
    updateScroll();

    const clock=new THREE.Clock();
    const lookTarget = new THREE.Vector3();
    function animate(){
      requestAnimationFrame(animate);
      const dt=Math.min(.05,clock.getDelta());

      // ==========================================================
      // V18B PROLOGUE ONLY
      // ==========================================================
      if(inAerial){
        v17HandoffDone=false;

        // Slow, heavy response matching the approved V17 restraint.
        smoothAerial += (targetAerial-smoothAerial)*(1-Math.exp(-dt*1.35));
        const ap=THREE.MathUtils.clamp(smoothAerial,0,1);

        const apPos=aerialCurve.getPointAt(ap);
        camera.position.lerp(apPos,1-Math.exp(-dt*1.55));

        const desired=aerialLookTarget(ap);
        lookTarget.lerp(desired,1-Math.exp(-dt*.70));

        const aq=new THREE.Quaternion();
        const am=new THREE.Matrix4().lookAt(
          camera.position,
          lookTarget,
          new THREE.Vector3(0,1,0)
        );
        aq.setFromRotationMatrix(am);
        camera.quaternion.slerp(aq,1-Math.exp(-dt*.58));

        const f=aerialFov(ap);
        camera.fov+=(f-camera.fov)*(1-Math.exp(-dt*.68));
        camera.updateProjectionMatrix();

        particles.rotation.y += dt*.0012;
        warm.intensity = 1450 + Math.sin(performance.now()*.00018)*65;

        renderer.render(scene,camera);
        return;
      }

      // Exact seamless handoff into V17.
      // Only executes once, immediately after leaving the prologue.
      if(!v17HandoffDone){
        v17HandoffDone=true;
        smoothAerial=1;

        camera.position.copy(v17Entry);
        lookTarget.copy(cameraLookTarget(0,camera.position));

        const q=new THREE.Quaternion();
        const m=new THREE.Matrix4().lookAt(
          camera.position,
          lookTarget,
          new THREE.Vector3(0,1,0)
        );
        q.setFromRotationMatrix(m);
        camera.quaternion.copy(q);

        camera.fov=52;
        camera.updateProjectionMatrix();

        // Reset V17-local smoothing to its actual beginning.
        smoothProgress=0;
      }

      // ==========================================================
      // ORIGINAL V17 FROM HERE DOWN — UNCHANGED
      // ==========================================================

      // Cinematic scroll inertia.
      smoothProgress += (targetProgress-smoothProgress) * (1-Math.exp(-dt*2.35));
      const p=THREE.MathUtils.clamp(smoothProgress,0,1);
      let targetFov=48;
      if(p<.28) targetFov=THREE.MathUtils.lerp(60,54,p/.28);
      else if(p<.52) targetFov=THREE.MathUtils.lerp(54,47,(p-.28)/.24);
      else if(p<.72) targetFov=THREE.MathUtils.lerp(47,50,(p-.52)/.20);
      else if(p<.82) targetFov=THREE.MathUtils.lerp(50,58,(p-.72)/.10);
      else targetFov=THREE.MathUtils.lerp(58,47,(p-.82)/.18);
      camera.fov += (targetFov-camera.fov)*(1-Math.exp(-dt*1.15));
      camera.updateProjectionMatrix();


      // Camera position follows the authored route.
      const cp=curve.getPointAt(p);

      // Keep v2's close immersive relationship, but prevent geometry from swallowing the frame.
      const floorY=terrainHeight(cp.x,cp.z-110);
      const phaseClearance = p<.28 ? 180 : (p<.52 ? 78 : (p<.72 ? 92 : 88));
      cp.y=Math.max(cp.y,floorY+phaseClearance);

      // Side-wall awareness: only lift if nearby walls threaten the camera.
      let sideThreat=0;
      for(const dx of [-85,-60,60,85]){
        const h=terrainHeight(cp.x+dx,cp.z-110+40);
        sideThreat=Math.max(sideThreat,h-(cp.y-55));
      }
      if(sideThreat>0) cp.y += Math.min(70,sideThreat*.45);
      camera.position.lerp(cp,1-Math.exp(-dt*3.0));

      // Terrain-aware cinematic aim.
      const desiredLook=cameraLookTarget(p,camera.position);
      lookTarget.lerp(desiredLook,1-Math.exp(-dt*1.35));

      // Never allow the view target to fall into the ground immediately ahead.
      const targetFloor=terrainHeight(lookTarget.x,lookTarget.z-110);
      lookTarget.y=Math.max(lookTarget.y,targetFloor+12);

      const q=new THREE.Quaternion();
      const m=new THREE.Matrix4().lookAt(
        camera.position,
        lookTarget,
        new THREE.Vector3(0,1,0)
      );
      q.setFromRotationMatrix(m);
      camera.quaternion.slerp(q,1-Math.exp(-dt*1.10));

      // Environment life stays subtle. The terrain itself remains monumental/stable.
      particles.rotation.y += dt*.0012;
      warm.intensity = 1450 + Math.sin(performance.now()*.00018)*65;

      
      
      renderer.render(scene,camera);
    }

    addEventListener('resize',()=>{
      camera.aspect=innerWidth/innerHeight;
      camera.updateProjectionMatrix();
      renderer.setSize(innerWidth,innerHeight);
      renderer.setPixelRatio(Math.min(devicePixelRatio,1.7));
      prologuePx=innerHeight*1.4;
      v17ScrollPx=innerHeight*5.5;
      updateScroll();
    });
    document.documentElement.classList.add('ready');animate();
  </script>
</body>
</html>
